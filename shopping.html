<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>買い物リスト - ゴリのレシピ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #111;
      --card: #1b1b1b;
      --accent: #e53935;
      --accent-soft: #ff7043;
      --text: #f5f5f5;
      --muted: #aaaaaa;
      --border: #333;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #222 0, #050505 55%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-title {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.95rem;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: #151515;
      color: var(--text);
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .icon-btn:hover {
      background: #222;
      border-color: var(--accent-soft);
      transform: translateY(-1px);
    }
    .btn-sync {
      background-color: #27ae60;
      border-color: #27ae60;
    }
    .btn-sync:hover {
      background-color: #2ecc71;
      border-color: #2ecc71;
    }

    /* 同期ステータスバー */
    .sync-status-bar {
      font-size: 0.75rem;
      font-weight: bold;
      color: #2ecc71;
      background: rgba(39, 174, 96, 0.1);
      border: 1px solid rgba(39, 174, 96, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 1rem;
      text-align: center;
    }

    /* Layout */
    main {
      padding: 1rem;
      max-width: 1100px; 
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    .list-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    /* 📱 スマホで横スライドを可能にする魔法のラッパー枠 */
    .table-container {
      width: 100%;
      overflow-x: auto; /* 横方向に溢れたらスクロールさせる */
      -webkit-overflow-scrolling: touch; /* ズレのない滑らかなスワイプ感にする */
      background: rgba(10, 10, 10, 0.9);
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    /* Table Style */
    .shopping-table {
      width: 100%;
      min-width: 850px; /* 👈 ココが重要！スマホでも潰れない最小幅をしっかり確保 */
      border-collapse: collapse;
    }
    .shopping-table th, 
    .shopping-table td {
      padding: 0.6rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .shopping-table th {
      background: #151515;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    
    /* 各列の幅比率を最適化 */
    .col-check { width: 45px; text-align: center; }
    .col-genre { width: 110px; }
    .col-name { width: 170px; }
    .col-season { width: 110px; } 
    .col-points { width: 220px; }
    .col-history { width: 180px; }
    .col-memo { width: auto; min-width: 120px; }
    .col-action { width: 50px; text-align: center; }

    /* Inputs */
    .cell-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      padding: 0.3rem 0.4rem;
      font-size: 0.85rem;
      border-radius: 0.25rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .cell-input:focus {
      outline: none;
      background: #151515;
      border-color: var(--accent-soft);
    }
    
    /* 多段入力用のボックスラッパー */
    .multi-input-container {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .multi-input-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    .inner-add-btn {
      background: #222;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 0.1rem 0.3rem;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .inner-add-btn:hover {
      border-color: var(--accent-soft);
      color: var(--text);
    }
    .toggle-expand-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--accent-soft);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 2px;
      display: inline-block;
    }
    .toggle-expand-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    /* Checkbox */
    .checkbox-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .custom-checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    /* Checked row styling */
    .completed-row .cell-input {
      color: var(--muted);
      text-decoration: line-through;
      opacity: 0.6;
    }

    /* Delete button */
    .delete-btn {
      background: transparent;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 0.9rem;
      transition: color 0.15s;
    }
    .delete-btn:hover {
      color: var(--accent);
    }

    @media (max-width: 768px) {
      .shopping-table th, .shopping-table td {
        padding: 0.5rem 0.4rem;
      }
      .cell-input {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">買い物リスト</div>
    <div style="display: flex; gap: 0.5rem;">
      <button id="btn-save" class="icon-btn btn-sync" onclick="executeSave(false)">💾 保存</button>
      <a href="index.html" class="icon-btn">🍳 <span>ゴリのレシピ</span></a>
    </div>
  </header>

  <main>
    <div id="sync-status" class="sync-status-bar">🔄 接続確認中...</div>

    <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;">
      <input type="text" id="searchBox" class="cell-input" style="flex: 1; min-width: 150px; background: rgba(20,20,20,0.8); border: 1px solid var(--border);" placeholder="🔍 キーワードで検索（例: 茄子、春）">
      <select id="genreFilter" class="cell-input" style="width: auto; min-width: 120px; background: rgba(20,20,20,0.8); border: 1px solid var(--border); color: var(--text);">
        <option value="">📁 すべてのジャンル</option>
      </select>
    </div>

    <div class="list-actions">
      <button class="icon-btn" id="clearCheckedBtn" style="font-size: 0.75rem; color: var(--muted);">チェック済を削除</button>
    </div>

    <div class="table-container">
      <table class="shopping-table">
        <thead>
          <tr>
            <th class="col-check">☑</th>
            <th class="col-genre">ジャンル</th>
            <th class="col-name">名称</th>
            <th class="col-season">旬</th> 
            <th class="col-points">選ぶポイント</th>
            <th class="col-history">購入日と金額</th>
            <th class="col-memo">備考</th>
            <th class="col-action"></th>
          </tr>
        </thead>
        <tbody id="listBody">
          </tbody>
      </table>
    </div>
  </main>

  <datalist id="genreSuggestions"></datalist>

  <script>
    // 🔗 GASのWebアプリURL（随時自動保存用）
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwPoY-Gev1Hwq6ljC0m1Y_PFLPSWL6ZrTo5zt0XJc42syyyuMa8qQFQumoquIsP70XG/exec";

    // 🛠️ GitHub設定
    const GITHUB_REPO = "yunio-omaru/cook.github.io"; 
    const FILE_PATH = "shopping.json"; 

    let appData = {
      items: []
    };

    // 各マスの展開状態を記憶するオブジェクト
    let expandedStates = {};

    // 🔒 通信中の連続操作バグを防ぐためのフラグ
    let isSavingNow = false; 

    const listBody = document.getElementById('listBody');
    const genreSuggestions = document.getElementById('genreSuggestions');
    const clearCheckedBtn = document.getElementById('clearCheckedBtn');

    document.addEventListener('DOMContentLoaded', () => {
      loadFromSpreadsheet();
    });

    // スプレッドシートからの読み込み (GET)
    async function loadFromSpreadsheet() {
      const statusLabel = document.getElementById('sync-status');
      statusLabel.innerText = "🔄 スプレッドシートからデータを同期中...";
      try {
        const res = await fetch(GAS_API_URL);
        if(res.ok) {
          const data = await res.json();
          if (data && data.items) {
            appData = data;
          } else if (data && Array.isArray(data)) {
            appData.items = data;
          }
          statusLabel.innerText = "✅ 同期完了";
          renderApp();
        }
      } catch(e) {
        console.error(e);
        statusLabel.innerText = "❌ 読み込み同期エラー";
        renderApp();
      }
    }

    // 保存処理（手動・自動の中継）
    async function executeSave(isAutoSave = false) {
      if (isSavingNow) return; 

      if (isAutoSave) {
        isSavingNow = true;
        setInputsDisabled(true); 
        collectFormData();
        await saveToSpreadsheet();
        return;
      }

      const saveBtn = document.getElementById('btn-save');
      const token = prompt("GitHubの shopping.json に保存するため、ghpトークンコードを入力してください：");
      if (!token) return; 

      isSavingNow = true;
      setInputsDisabled(true); 
      saveBtn.disabled = true;
      saveBtn.innerText = "⏳ GitHubに保存中...";

      collectFormData(); 

      try {
        await saveToGitHub(token.trim());
      } catch (e) {
        console.error(e);
        alert("GitHubへの保存処理でエラーが発生しました。");
      } finally {
        isSavingNow = false;
        setInputsDisabled(false); 
        saveBtn.disabled = false;
        saveBtn.innerText = "💾 保存";
      }
    }

    // クラウド保存中に入力欄やボタンを一時的に触れなくする防御関数
    function setInputsDisabled(disabled) {
      const inputs = listBody.querySelectorAll('.cell-input, .custom-checkbox, .delete-btn, .inner-add-btn, .toggle-expand-btn');
      inputs.forEach(input => {
        input.disabled = disabled;
        if(disabled) input.style.opacity = "0.5";
        else input.style.opacity = "1";
      });
      clearCheckedBtn.disabled = disabled;
    }

    // GitHub APIを使ってファイルを直接上書きコミットする関数
    async function saveToGitHub(token) {
      const statusLabel = document.getElementById('sync-status');
      statusLabel.innerText = "💾 GitHubに保存中...";

      const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${FILE_PATH}`;
      
      let sha = "";
      try {
        const getRes = await fetch(apiUrl, {
          headers: { "Authorization": `token ${token}` }
        });
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha; 
        }
      } catch(e) {
        console.log("既存ファイルなし");
      }

      const jsonContent = JSON.stringify(appData, null, 2);
      const base64Content = btoa(unescape(encodeURIComponent(jsonContent)));

      const putRes = await fetch(apiUrl, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Update shopping.json via app button", 
          content: base64Content,
          sha: sha || undefined
        })
      });

      if (putRes.ok) {
        statusLabel.innerText = "✅ GitHubの shopping.json に保存しました！";
        renderApp();
      } else {
        throw new Error("GitHubへのコミットに失敗しました");
      }
    }

    // 随時バックグラウンド自動保存用のスプシ送信関数
    async function saveToSpreadsheet() {
      const statusLabel = document.getElementById('sync-status');
      statusLabel.innerText = "🔄 バックグラウンド自動保存中...";
      try {
        const res = await fetch(GAS_API_URL, { 
          method: "POST", 
          body: JSON.stringify(appData) 
        });
        if (res.ok) {
          statusLabel.innerText = "✅ 自動保存完了 (スプシ)";
          renderApp(); 
        }
      } catch(e) {
        console.error(e);
      } finally {
        isSavingNow = false;
        setInputsDisabled(false); 
      }
    }

    // 画面の入力内容をかき集めてappDataに格納する関数
    function collectFormData() {
      const rows = listBody.querySelectorAll('tr');
      const updatedItems = [];

      rows.forEach(row => {
        const idx = parseInt(row.dataset.index, 10);
        const chk = row.querySelector('.custom-checkbox');
        const inputGenre = row.querySelector('.input-genre');
        const inputName = row.querySelector('.input-name');
        const inputSeason = row.querySelector('.input-season'); 
        const inputMemo = row.querySelector('.input-memo');

        if (!inputName) return;
        const nameValue = inputName.value.trim();
        if (nameValue === '') return;

        let pointsArray = [];
        let historyArray = [];
        if (idx !== -1 && appData.items[idx]) {
          pointsArray = Array.isArray(appData.items[idx].points) ? [...appData.items[idx].points] : (appData.items[idx].points ? [appData.items[idx].points] : []);
          historyArray = Array.isArray(appData.items[idx].history) ? [...appData.items[idx].history] : (appData.items[idx].history ? [appData.items[idx].history] : []);
        }

        const pointsInputs = row.querySelectorAll('.input-point');
        pointsInputs.forEach((input, i) => {
          pointsArray[i] = input.value.trim();
        });
        pointsArray = pointsArray.filter(v => v !== undefined && v !== ''); 

        const historyInputs = row.querySelectorAll('.input-history');
        historyInputs.forEach((input, i) => {
          historyArray[i] = input.value.trim();
        });
        historyArray = historyArray.filter(v => v !== undefined && v !== ''); 

        updatedItems.push({
          checked: chk ? chk.checked : false,
          genre: inputGenre ? inputGenre.value.trim() : '',
          name: nameValue,
          season: inputSeason ? inputSeason.value.trim() : '', 
          points: pointsArray, 
          history: historyArray, 
          memo: inputMemo ? inputMemo.value.trim() : ''
        });
      });

      updatedItems.sort((a, b) => {
        if (!a.genre && b.genre) return 1;
        if (a.genre && !b.genre) return -1;
        if (a.genre === b.genre) return 0;
        return a.genre.localeCompare(b.genre, 'ja');
      });

      appData.items = updatedItems;
    }

    // 画面をリフレッシュして最新データを描画する関数
    function renderApp() {
      const activeEl = document.activeElement;
      let savedFocusInfo = null;
      if (activeEl && activeEl.classList.contains('cell-input')) {
        const row = activeEl.closest('tr');
        if (row) {
          const inputsInRow = Array.from(row.querySelectorAll(`.${activeEl.classList[1]}`));
          const inputIndex = inputsInRow.indexOf(activeEl);
          savedFocusInfo = {
            rowIndex: row.dataset.index,
            className: activeEl.classList[1], 
            inputIndex: inputIndex,
            value: activeEl.value 
          };
        }
      }

      listBody.innerHTML = '';

      if (appData.items && Array.isArray(appData.items)) {
        appData.items.forEach((item, index) => {
          createRowHTML(item, index);
        });
      }

      createRowHTML({ checked: false, genre: '', name: '', season: '', points: [], history: [], memo: '' }, -1);
      
      if (typeof updateGenreSuggestions === 'function') {
        updateGenreSuggestions();
      }

      if (savedFocusInfo) {
        const targetRow = listBody.querySelector(`tr[data-index="${savedFocusInfo.rowIndex}"]`);
        if (targetRow) {
          const inputs = targetRow.querySelectorAll(`.${savedFocusInfo.className}`);
          const targetInput = inputs[savedFocusInfo.inputIndex];
          if (targetInput) {
            targetInput.focus();
            const val = targetInput.value;
            targetInput.value = '';
            targetInput.value = val;
          }
        }
      }
    }

    // 1行分のHTMLを生成してイベントを紐付けるメイン関数
    function createRowHTML(item, index) {
      const tr = document.createElement('tr');
      tr.dataset.index = index;
      if (item.checked) tr.classList.add('completed-row');

      const isNew = index === -1;

      const pointsList = Array.isArray(item.points) ? item.points : (item.points ? [item.points] : []);
      const historyList = Array.isArray(item.history) ? item.history : (item.history ? [item.history] : []);

      const isPointsExpanded = expandedStates[`${index}-points`] || false;
      const isHistoryExpanded = expandedStates[`${index}-history`] || false;

      // --- 1. 選ぶポイント列のHTML構築 ---
      let pointsHTML = `<div class="multi-input-container">`;
      const pointsShowCount = isPointsExpanded ? pointsList.length + 1 : 1;
      
      for (let i = 0; i < Math.max(1, pointsShowCount); i++) {
        const val = pointsList[i] || '';
        if (!isPointsExpanded && i > 0) break;
        pointsHTML += `
          <div class="multi-input-row">
            <input type="text" class="cell-input input-point" data-subindex="${i}" value="${val}" placeholder="・ポイント">
          </div>`;
      }
      if (!isNew && pointsList.length > 0) {
        pointsHTML += `<div><button type="button" class="toggle-expand-btn" data-type="points">${isPointsExpanded ? '▲ 閉じる' : `➕ 展開 (${pointsList.length})`}</button></div>`;
      } else if (isNew || isPointsExpanded) {
        pointsHTML += `<div><button type="button" class="inner-add-btn" data-type="points">＋ 項目追加</button></div>`;
      }
      pointsHTML += `</div>`;


      // --- 2. 購入日と金額列のHTML構築 ---
      let historyHTML = `<div class="multi-input-container">`;
      const historyShowCount = isHistoryExpanded ? historyList.length + 1 : 1;
      
      for (let i = 0; i < Math.max(1, historyShowCount); i++) {
        const val = historyList[i] || '';
        if (!isHistoryExpanded && i > 0) break;
        historyHTML += `
          <div class="multi-input-row">
            <input type="text" class="cell-input input-history" data-subindex="${i}" value="${val}" placeholder="例: 7/8 150円">
          </div>`;
      }
      if (!isNew && historyList.length > 0) {
        historyHTML += `<div><button type="button" class="toggle-expand-btn" data-type="history">${isHistoryExpanded ? '▲ 閉じる' : `➕ 展開 (${historyList.length})`}</button></div>`;
      } else if (isNew || isHistoryExpanded) {
        historyHTML += `<div><button type="button" class="inner-add-btn" data-type="history">＋ 履歴追加</button></div>`;
      }
      historyHTML += `</div>`;


      // --- 3. テーブル全体の反映 ---
      tr.innerHTML = `
        <td class="col-check">
          <div class="checkbox-wrapper">
            <input type="checkbox" class="custom-checkbox" ${item.checked ? 'checked' : ''} ${isNew ? 'disabled' : ''}>
          </div>
        </td>
        <td class="col-genre">
          <input type="text" class="cell-input input-genre" list="genreSuggestions" value="${item.genre || ''}" placeholder="例: 食材">
        </td>
        <td class="col-name">
          <input type="text" class="cell-input input-name" value="${item.name || ''}" placeholder="＋ 追加...">
        </td>
        <td class="col-season">
          <input type="text" class="cell-input input-season" value="${item.season || ''}" placeholder="例: 夏">
        </td>
        <td class="col-points">
          ${pointsHTML}
        </td>
        <td class="col-history">
          ${historyHTML}
        </td>
        <td class="col-memo">
          <input type="text" class="cell-input input-memo" value="${item.memo || ''}" placeholder="">
        </td>
        <td class="col-action">
          ${isNew ? '' : '<button class="delete-btn" title="削除">×</button>'}
        </td>
      `;

      // --- 4. 各種イベントリスナーの登録 ---
      const chk = tr.querySelector('.custom-checkbox');
      const inputGenre = tr.querySelector('.input-genre');
      const inputName = tr.querySelector('.input-name');
      const inputSeason = tr.querySelector('.input-season'); 
      const inputMemo = tr.querySelector('.input-memo');
      const delBtn = tr.querySelector('.delete-btn');

      if (chk) {
        chk.addEventListener('change', () => { executeSave(true); });
      }

      const syncInputToData = (input, key, subidx) => {
        if (isNew) return; 
        if (!appData.items[index]) return;
        if (subidx !== undefined) {
          appData.items[index][key][subidx] = input.value.trim();
        } else {
          appData.items[index][key] = input.value.trim();
        }
      };

      const handleInputChange = () => { executeSave(true); };
      
      inputGenre.addEventListener('blur', handleInputChange);
      inputName.addEventListener('blur', handleInputChange);
      inputSeason.addEventListener('blur', handleInputChange); 
      inputMemo.addEventListener('blur', handleInputChange);

      tr.querySelectorAll('.input-point').forEach(input => {
        const subidx = parseInt(input.dataset.subindex, 10);
        input.addEventListener('input', () => syncInputToData(input, 'points', subidx));
        input.addEventListener('blur', handleInputChange);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.isComposing) { input.blur(); }
        });
      });

      tr.querySelectorAll('.input-history').forEach(input => {
        const subidx = parseInt(input.dataset.subindex, 10);
        input.addEventListener('input', () => syncInputToData(input, 'history', subidx));
        input.addEventListener('blur', handleInputChange);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.isComposing) { input.blur(); }
        });
      });

      [inputGenre, inputName, inputSeason, inputMemo].forEach(input => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.isComposing) { input.blur(); }
        });
      });

      tr.querySelectorAll('.inner-add-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const type = btn.dataset.type;
          expandedStates[`${index}-${type}`] = true; 
          collectFormData();
          if(type === 'points') appData.items[index].points.push('');
          if(type === 'history') appData.items[index].history.push('');
          renderApp();
          
          const inputs = tr.querySelectorAll(`.input-${type === 'points' ? 'point' : 'history'}`);
          if(inputs.length > 0) inputs[inputs.length - 1].focus();
        });
      });

      tr.querySelectorAll('.toggle-expand-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const type = btn.dataset.type;
          const key = `${index}-${type}`;
          collectFormData();
          expandedStates[key] = !expandedStates[key]; 
          renderApp();
        });
      });

      if (delBtn) {
        delBtn.addEventListener('click', () => {
          inputName.value = ''; 
          executeSave(true);
        });
      }

      listBody.appendChild(tr);
    }
  </script>

  <script>
    const searchBox = document.getElementById('searchBox');
    const genreFilter = document.getElementById('genreFilter');

    function toKatakana(str) {
      return str.replace(/[\u3041-\u3096]/g, function(match) {
        return String.fromCharCode(match.charCodeAt(0) + 0x60);
      });
    }
    function toHiragana(str) {
      return str.replace(/[\u30a1-\u30f6]/g, function(match) {
        return String.fromCharCode(match.charCodeAt(0) - 0x60);
      });
    }

    function applyFilter() {
      const rawKeyword = searchBox.value.toLowerCase().trim().normalize("NFKC");
      const keywordHira = toHiragana(rawKeyword);
      const keywordKata = toKatakana(rawKeyword);
      const selectedGenre = genreFilter.value;
      const rows = listBody.querySelectorAll('tr');

      rows.forEach(row => {
        if (row.dataset.index === "-1") {
          row.style.display = '';
          return;
        }

        const genreInput = row.querySelector('.input-genre');
        const nameInput = row.querySelector('.input-name');
        const seasonInput = row.querySelector('.input-season'); 
        const memoInput = row.querySelector('.input-memo');
        
        const idx = parseInt(row.dataset.index, 10);
        let pointsStr = "";
        let historyStr = "";
        if (appData.items[idx]) {
          if (Array.isArray(appData.items[idx].points)) pointsStr = appData.items[idx].points.join(' ');
          if (Array.isArray(appData.items[idx].history)) historyStr = appData.items[idx].history.join(' ');
        }

        const genreText = genreInput ? genreInput.value.toLowerCase().normalize("NFKC") : '';
        const nameText = nameInput ? nameInput.value.toLowerCase().normalize("NFKC") : '';
        const seasonText = seasonInput ? seasonInput.value.toLowerCase().normalize("NFKC") : ''; 
        const memoText = memoInput ? memoInput.value.toLowerCase().normalize("NFKC") : '';
        
        const combinedText = `${genreText} ${nameText} ${seasonText} ${memoText} ${pointsStr.toLowerCase().normalize("NFKC")} ${historyStr.toLowerCase().normalize("NFKC")}`;

        const matchesKeyword = !rawKeyword || 
          combinedText.includes(keywordHira) || 
          combinedText.includes(keywordKata);

        const matchesGenre = !selectedGenre || (genreInput && genreInput.value === selectedGenre);

        if (matchesKeyword && matchesGenre) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }

    searchBox.addEventListener('input', applyFilter);
    genreFilter.addEventListener('change', applyFilter);

    function updateGenreSuggestions() {
      if (!appData.items || !Array.isArray(appData.items)) return;
      const genres = [...new Set(appData.items.map(item => item.genre).filter(g => g && g.trim() !== ''))];
      
      genreSuggestions.innerHTML = genres.map(g => `<option value="${g}"></option>`).join('');

      const currentSelected = genreFilter.value;
      genreFilter.innerHTML = '<option value="">📁 すべてのジャンル</option>' + 
        genres.map(g => `<option value="${g}">${g}</option>`).join('');
      genreFilter.value = currentSelected;
    }

    const originalRenderApp = renderApp;
    renderApp = function() {
      originalRenderApp();
      applyFilter(); 
    };

    clearCheckedBtn.addEventListener('click', () => {
      if(confirm('チェックのついたアイテムを削除しますか？')) {
        if (appData.items && Array.isArray(appData.items)) {
          appData.items = appData.items.filter(item => !item.checked);
          executeSave(false);
        }
      }
    });
  </script>
</body>
</html>
