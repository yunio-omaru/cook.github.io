<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>買い物リスト - ゴリのレシピ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #111;
      --card: #1b1b1b;
      --accent: #e53935;
      --accent-soft: #ff7043;
      --text: #f5f5f5;
      --muted: #aaaaaa;
      --border: #333;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #222 0, #050505 55%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-title {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.95rem;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: #151515;
      color: var(--text);
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .icon-btn:hover {
      background: #222;
      border-color: var(--accent-soft);
      transform: translateY(-1px);
    }
    .btn-sync {
      background-color: #27ae60;
      border-color: #27ae60;
    }
    .btn-sync:hover {
      background-color: #2ecc71;
      border-color: #2ecc71;
    }

    /* 同期ステータスバー */
    .sync-status-bar {
      font-size: 0.75rem;
      font-weight: bold;
      color: #2ecc71;
      background: rgba(39, 174, 96, 0.1);
      border: 1px solid rgba(39, 174, 96, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 1rem;
      text-align: center;
    }

    /* Layout */
    main {
      padding: 1rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    .list-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    /* Table Style */
    .shopping-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(10, 10, 10, 0.9);
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .shopping-table th, 
    .shopping-table td {
      padding: 0.6rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .shopping-table th {
      background: #151515;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    
    /* Column widths */
    .col-check { width: 40px; text-align: center; }
    .col-genre { width: 25%; }
    .col-name { width: 40%; }
    .col-memo { width: auto; }
    .col-action { width: 50px; text-align: center; }

    /* Inputs */
    .cell-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      padding: 0.3rem 0.4rem;
      font-size: 0.85rem;
      border-radius: 0.25rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .cell-input:focus {
      outline: none;
      background: #151515;
      border-color: var(--accent-soft);
    }
    
    /* Checkbox */
    .checkbox-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .custom-checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    /* Checked row styling */
    .completed-row .cell-input {
      color: var(--muted);
      text-decoration: line-through;
      opacity: 0.6;
    }

    /* Delete button */
    .delete-btn {
      background: transparent;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 0.9rem;
      transition: color 0.15s;
    }
    .delete-btn:hover {
      color: var(--accent);
    }

    @media (max-width: 600px) {
      .shopping-table th, .shopping-table td {
        padding: 0.4rem;
      }
      .cell-input {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">買い物リスト</div>
    <div style="display: flex; gap: 0.5rem;">
      <button id="btn-save" class="icon-btn btn-sync" onclick="executeSave()">💾 保存</button>
      <a href="index.html" class="icon-btn">🍳 <span>ゴリのレシピ</span></a>
    </div>
  </header>

  <main>
    <div id="sync-status" class="sync-status-bar">🔄 接続確認中...</div>

    <div class="list-actions">
      <button class="icon-btn" id="clearCheckedBtn" style="font-size: 0.75rem; color: var(--muted);">チェック済を削除</button>
    </div>

    <table class="shopping-table">
      <thead>
        <tr>
          <th class="col-check">☑</th>
          <th class="col-genre">ジャンル</th>
          <th class="col-name">名称</th>
          <th class="col-memo">備考</th>
          <th class="col-action"></th>
        </tr>
      </thead>
      <tbody id="listBody">
        </tbody>
    </table>
  </main>

  <datalist id="genreSuggestions"></datalist>

  <script>
    // 🔗 GASのWebアプリURL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwPoY-Gev1Hwq6ljC0m1Y_PFLPSWL6ZrTo5zt0XJc42syyyuMa8qQFQumoquIsP70XG/exec";

    // 📦 アプリデータ
    let appData = {
      items: []
    };

    const listBody = document.getElementById('listBody');
    const genreSuggestions = document.getElementById('genreSuggestions');
    const clearCheckedBtn = document.getElementById('clearCheckedBtn');

    // 起動時の初期処理
    document.addEventListener('DOMContentLoaded', () => {
      loadFromSpreadsheet();
    });

    /*** 📥 スプレッドシートからデータを読み込む (GET)
    */
    async function loadFromSpreadsheet() {
      const statusLabel = document.getElementById('sync-status');
      statusLabel.innerText = "🔄 スプレッドシートからデータを同期中...";
      try {
        const res = await fetch(GAS_API_URL);
        if(res.ok) {
          const data = await res.json();
          if (data && data.items) {
            appData = data;
          } else if (data && Array.isArray(data)) {
            appData.items = data;
          }
          statusLabel.innerText = "✅ 同期完了";
          renderApp();
        }
      } catch(e) {
        console.error(e);
        statusLabel.innerText = "❌ 読み込み同期エラー";
        renderApp();
      }
    }

    /*** 💾 保存処理（共通呼び出し用の中継関数）
    */
    async function executeSave(isAutoSave = false) {
      const saveBtn = document.getElementById('btn-save');
      
      // 手動保存のときだけボタンを「保存中」表示にして連打防止する
      if (!isAutoSave) {
        saveBtn.disabled = true;
        saveBtn.innerText = "⏳ 保存中...";
      }

      try {
        collectFormData(); // 画面の最新状態をappDataに集約
        await saveToSpreadsheet();
      } catch (e) {
        console.error(e);
        if (!isAutoSave) alert("保存処理でエラーが発生しました");
      } finally {
        if (!isAutoSave) {
          saveBtn.disabled = false;
          saveBtn.innerText = "💾 保存";
        }
      }
    }

    /*** 📝 画面の入力値をappDataに集約する
    */
    function collectFormData() {
      const rows = listBody.querySelectorAll('tr');
      const updatedItems = [];

      rows.forEach(row => {
        const index = parseInt(row.dataset.index);
        if (index === -1) return; // 新規入力用の空行はスキップ

        const chk = row.querySelector('.custom-checkbox');
        const inputGenre = row.querySelector('.input-genre');
        const inputName = row.querySelector('.input-name');
        const inputMemo = row.querySelector('.input-memo');

        const nameValue = inputName.value.trim();
        // 名称が空のものは除外（自動削除扱い）
        if (nameValue !== '') {
          updatedItems.push({
            checked: chk.checked,
            genre: inputGenre.value.trim(),
            name: nameValue,
            memo: inputMemo.value.trim()
          });
        }
      });

      // ジャンルで自動ソート
      updatedItems.sort((a, b) => {
        if (!a.genre && b.genre) return 1;
        if (a.genre && !b.genre) return -1;
        if (a.genre === b.genre) return 0;
        return a.genre.localeCompare(b.genre, 'ja');
      });

      appData.items = updatedItems;
    }

    /*** 💻 データを画面に描写する
    */
    function renderApp() {
      // 現在フォーカスが当たっている要素の情報を一時退避
      const activeEl = document.activeElement;
      let savedFocusInfo = null;
      if (activeEl && activeEl.classList.contains('cell-input')) {
        const row = activeEl.closest('tr');
        if (row) {
          savedFocusInfo = {
            index: row.dataset.index,
            className: activeEl.classList[1] // input-genre, input-name, input-memo のいずれか
          };
        }
      }

      listBody.innerHTML = '';

      // 1. 保存アイテムを順に描画
      if (appData.items && Array.isArray(appData.items)) {
        appData.items.forEach((item, index) => {
          createRowHTML(item, index);
        });
      }

      // 2. 最下部に新しい入力用の空行を追加
      createRowHTML({ checked: false, genre: '', name: '', memo: '' }, -1);

      // 3. ジャンルサジェストの更新
      updateGenreSuggestions();

      // 4. 自動ソート等で再描画された後、元の入力欄にフォーカスを復元する
      if (savedFocusInfo) {
        const targetRow = listBody.querySelector(`tr[data-index="${savedFocusInfo.index}"]`);
        if (targetRow) {
          const targetInput = targetRow.querySelector(`.${savedFocusInfo.className}`);
          if (targetInput) {
            targetInput.focus();
            // カーソルを文字の一番後ろに移動させる
            const val = targetInput.value;
            targetInput.value = '';
            targetInput.value = val;
          }
        }
      }
    }

    // 行のHTMLを動的に生成する
    function createRowHTML(item, index) {
      const tr = document.createElement('tr');
      tr.dataset.index = index;
      if (item.checked) tr.classList.add('completed-row');

      const isNew = index === -1;

      tr.innerHTML = `
        <td class="col-check">
          <div class="checkbox-wrapper">
            <input type="checkbox" class="custom-checkbox" ${item.checked ? 'checked' : ''} ${isNew ? 'disabled' : ''}>
          </div>
        </td>
        <td class="col-genre">
          <input type="text" class="cell-input input-genre" list="genreSuggestions" value="${item.genre || ''}" placeholder="例: 食材">
        </td>
        <td class="col-name">
          <input type="text" class="cell-input input-name" value="${item.name || ''}" placeholder="＋ 追加...">
        </td>
        <td class="col-memo">
          <input type="text" class="cell-input input-memo" value="${item.memo || ''}" placeholder="">
        </td>
        <td class="col-action">
          ${isNew ? '' : '<button class="delete-btn" title="削除">×</button>'}
        </td>
      `;

      const chk = tr.querySelector('.custom-checkbox');
      const inputGenre = tr.querySelector('.input-genre');
      const inputName = tr.querySelector('.input-name');
      const inputMemo = tr.querySelector('.input-memo');
      const delBtn = tr.querySelector('.delete-btn');

      // チェックボックス変更時は、引数に true を渡して自動保存（非同期）を走らせる
      if (chk) {
        chk.addEventListener('change', () => {
          executeSave(true);
        });
      }

      // 入力欄からフォーカスが外れた（あるいは別行へ移った）瞬間に自動保存
      const handleInputChange = () => {
        const nValue = inputName.value.trim();
        if (isNew) {
          if (nValue !== '') {
            executeSave(true);
          }
        } else {
          executeSave(true);
        }
      };

      inputGenre.addEventListener('blur', handleInputChange);
      inputName.addEventListener('blur', handleInputChange);
      inputMemo.addEventListener('blur', handleInputChange);

      // Enterキーで入力を確定した時も即座に自動保存が走るようにする
      [inputGenre, inputName, inputMemo].forEach(input => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            input.blur(); 
          }
        });
      });

      // 削除（×）ボタン
      if (delBtn) {
        delBtn.addEventListener('click', () => {
          inputName.value = ''; // 名称を空にして自動保存に回すことで削除扱いにする
          executeSave(true);
        });
      }

      listBody.appendChild(tr);
    }

    // ジャンルのプルダウン候補を更新
    function updateGenreSuggestions() {
      if (!appData.items || !Array.isArray(appData.items)) return;
      const genres = [...new Set(appData.items.map(item => item.genre).filter(g => g && g.trim() !== ''))];
      genreSuggestions.innerHTML = genres.map(g => `<option value="${g}"></option>`).join('');
    }

    // チェック済を一括削除するボタン
    clearCheckedBtn.addEventListener('click', () => {
      if(confirm('チェックのついたアイテムを削除しますか？')) {
        if (appData.items && Array.isArray(appData.items)) {
          appData.items = appData.items.filter(item => !item.checked);
          // 削除後は手動保存と同様に上部バーで進捗が分かりやすいよう通常のsaveを走らせる
          executeSave(false);
        }
      }
    });

    /*** 📤 スプレッドシートへデータを書き込む (POST)
    */
    async function saveToSpreadsheet() {
      const statusLabel = document.getElementById('sync-status');
      statusLabel.innerText = "💾 クラウドに保存中...";
      try {
        const res = await fetch(GAS_API_URL, { 
          method: "POST", 
          body: JSON.stringify(appData) 
        });
        if (res.ok) {
          statusLabel.innerText = "✅ 自動保存しました！";
          renderApp(); // 自動ソートされた最新状態で画面を更新
        } else {
          statusLabel.innerText = "❌ クラウド保存エラー(ステータス不正)";
        }
      } catch(e) {
        console.error(e);
        statusLabel.innerText = "❌ クラウド保存エラー ";
      }
    }
  </script>
</body>
</html>
