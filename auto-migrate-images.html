<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>レシピ画像自動変換・アップロード</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { margin-top: 0; color: #333; text-align: center; }
    .setup-section {
      background: #f7fafc; padding: 1.5rem; border-radius: 0.75rem; margin-bottom: 2rem; border-left: 4px solid #667eea;
    }
    .setup-section h2 { margin-top: 0; color: #2d3748; font-size: 1rem; }
    .form-row { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.3rem; }
    .form-row label { font-size: 0.9rem; color: #4a5568; font-weight: 600; }
    .form-row input { padding: 0.75rem; border: 1px solid #cbd5e0; border-radius: 0.5rem; font-size: 0.9rem; font-family: monospace; }
    .form-row input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    .buttons { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1.5rem; }
    button { flex: 1; min-width: 150px; padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover:not(:disabled) { background: #5568d3; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
    .status { margin-top: 2rem; padding: 1.5rem; border-radius: 0.75rem; display: none; }
    .status.show { display: block; }
    .status.success { background: #c6f6d5; border: 1px solid #9ae6b4; color: #22543d; }
    .status.error { background: #fed7d7; border: 1px solid #fc8181; color: #742a2a; }
    .status.info { background: #bee3f8; border: 1px solid #90cdf4; color: #2c5282; }
    .progress { margin-top: 1rem; background: #e2e8f0; height: 8px; border-radius: 999px; overflow: hidden; }
    .progress-bar { height: 100%; background: #667eea; width: 0%; transition: width 0.3s; }
    .log { margin-top: 1rem; background: #f7fafc; padding: 1rem; border-radius: 0.5rem; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; color: #4a5568; }
    .log-item { padding: 0.25rem 0; border-bottom: 1px solid #e2e8f0; }
    .log-success { color: #276749; }
    .log-error { color: #742a2a; }
    .log-info { color: #2c5282; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🖼️ レシピ画像自動変換・アップロード</h1>

    <div class="setup-section">
      <h2>📝 GitHub 認証情報を入力</h2>
      <div class="form-row">
        <label>GitHubユーザー名</label>
        <input type="text" id="ghUser" placeholder="例：yunio-omaru" />
      </div>
      <div class="form-row">
        <label>個人アクセストークン（PAT）</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" />
      </div>
    </div>

    <div class="buttons">
      <button class="btn-primary" onclick="startConversion()">🚀 画像を自動変換＆アップロード</button>
    </div>

    <div id="status" class="status">
      <div id="statusMessage"></div>
      <div class="progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script>
    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const item = document.createElement('div');
      item.className = `log-item log-${type}`;
      item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logDiv.appendChild(item);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function updateProgress(current, total) {
      const percent = total > 0 ? (current / total) * 100 : 0;
      document.getElementById('progressBar').style.width = percent + '%';
    }

    function showStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      const messageDiv = document.getElementById('statusMessage');
      statusDiv.className = `status show ${type}`;
      messageDiv.innerHTML = message;
    }

    async function startConversion() {
      const user = document.getElementById('ghUser').value.trim();
      const token = document.getElementById('ghToken').value.trim();

      if (!user || !token) {
        showStatus('❌ ユーザー名とトークンを入力してください', 'error');
        return;
      }

      document.getElementById('log').innerHTML = '';
      document.getElementById('status').classList.add('show');
      showStatus('処理中...', 'info');

      try {
        // Step 1: recipe-list.json の大容量対応ダウンロード
        log('📝 recipe-list.json を取得中 (大容量ファイルモード) ...', 'info');
        const jsonContentObj = await getLargeRecipeListJson(user, token);
        let recipeList = jsonContentObj.data;
        const jsonSha = jsonContentObj.sha;
        log(`✓ recipe-list.json を無事取得完了 (レシピ数: ${recipeList.length} 件)`, 'success');

        // Step 2: 各レシピHTMLから画像を抽出（ファイル名ベースで安全に管理）
        const imagesToUpload = {};
        const imageFileMapping = {};

        for (let i = 0; i < recipeList.length; i++) {
          updateProgress(i, recipeList.length);
          const recipe = recipeList[i];
          log(`処理中: ${recipe.file}`, 'info');

          let htmlContent = '';
          try {
            // HTMLも画像内蔵で大きくなっている可能性があるため大容量モードで取得
            htmlContent = await getLargeFileContent(user, token, `recipes/${recipe.file}`);
          } catch (e) {
            log(`⚠️ HTMLが取得できないためスキップします: ${recipe.file}`, 'info');
            continue;
          }

          const imageData = extractBase64Image(htmlContent);
          if (imageData) {
            const ext = imageData.format === 'png' ? 'png' : 'jpg';
            const targetImageName = `recipe_generated_${String(i + 1).padStart(2, '0')}.${ext}`;
            
            imagesToUpload[targetImageName] = { data: imageData.data, originFile: recipe.file };
            imageFileMapping[recipe.file] = targetImageName;
            
            log(`✓ 画像抽出成功 [${recipe.file}] -> ${targetImageName}`, 'success');
          } else {
            log(`  ↳ 埋め込み画像なし、または既に移行済みです。`, 'info');
          }
        }
        updateProgress(recipeList.length, recipeList.length);

        // Step 3: 画像のアップロード処理（既存チェック・sha上書き対応）
        if (Object.keys(imagesToUpload).length > 0) {
          log(`📤 ${Object.keys(imagesToUpload).length} 個の画像をGitHubへアップロード中...`, 'info');
          for (const [imgName, imgObj] of Object.entries(imagesToUpload)) {
            await uploadSingleImage(user, token, imgName, imgObj.data, imgObj.originFile);
          }
        } else {
          log('📤 新たにアップロードする画像はありません。', 'info');
        }

        // Step 4: 各レシピHTMLの一括書き換え
        log('🔄 レシピHTMLファイルを更新中...', 'info');
        for (let i = 0; i < recipeList.length; i++) {
          const recipe = recipeList[i];
          const mappedImg = imageFileMapping[recipe.file];
          if (!mappedImg) continue;

          log(`HTML更新中: ${recipe.file}`, 'info');
          let htmlContent = await getLargeFileContent(user, token, `recipes/${recipe.file}`);
          
          // 最新のshaを取得
          const fileMeta = await getFileMeta(user, token, `recipes/${recipe.file}`);

          htmlContent = htmlContent.replace(
            /src="data:image\/[^;]+;base64,[^"]+"/g,
            `src="../images/${mappedImg}"`
          );

          await updateFileOnGitHub(user, token, `recipes/${recipe.file}`, htmlContent, `update: ${recipe.file} 画像参照化`, fileMeta.sha);
          log(`✓ HTML更新完了: ${recipe.file}`, 'success');
        }

        // Step 5: recipe-list.json の大掃除
        log('📝 recipe-list.json の画像パスを外部ファイル参照に整えて保存中...', 'info');
        for (let i = 0; i < recipeList.length; i++) {
          const recipe = recipeList[i];
          const mappedImg = imageFileMapping[recipe.file];
          
          if (mappedImg) {
            recipe.thumb = `images/${mappedImg}`;
          } else if (recipe.thumb && recipe.thumb.startsWith('data:image')) {
            // 万が一HTML側に画像がなくJSON側だけに巨大データが残っていた場合はクリア
            recipe.thumb = "";
          }
        }

        const updatedJsonText = JSON.stringify(recipeList, null, 2);
        await updateFileOnGitHub(user, token, 'recipe-list.json', updatedJsonText, 'chore: クリーンアップおよび画像パス最適化', jsonSha);
        log('✓ recipe-list.json を完全に軽量・正常化しました！', 'success');

        showStatus('✅ すべての処理が正常に完了しました！<br>巨大だったJSONファイルも軽量化され、次からは爆速で動きます。', 'success');
        log('🎉 すべてのプロセスが正常終了しました！', 'success');

      } catch (err) {
        showStatus(`❌ エラー終了: ${err.message}`, 'error');
        log(`エラー詳細: ${err.message}`, 'error');
        console.error(err);
      }
    }

    // 💡 1MB以上の大容量JSONファイルに対応した最強のデータ取得関数
    async function getLargeRecipeListJson(user, token) {
      const metaUrl = `https://api.github.com/repos/${user}/cook.github.io/contents/recipe-list.json`;
      const metaRes = await fetch(metaUrl, { headers: { "Authorization": `token ${token}`, "Cache-Control": "no-cache" } });
      
      if (!metaRes.ok) return { data: [], sha: null };
      const metaData = await metaRes.json();
      
      // 💡 サイズ制限のない Blob API を経由してデータを取得する
      const blobUrl = `https://api.github.com/repos/${user}/cook.github.io/git/blobs/${metaData.sha}`;
      const blobRes = await fetch(blobUrl, { headers: { "Authorization": `token ${token}` } });
      if (!blobRes.ok) throw new Error('Blobデータ（大容量本体）の取得に失敗しました。');
      
      const blobData = await blobRes.json();
      // 改行コードなどを考慮して安全にデコードしてパース
      const rawText = decodeURIComponent(escape(atob(blobData.content.replace(/\s/g, ''))));
      return { data: JSON.parse(rawText), sha: metaData.sha };
    }

    // 💡 1MB以上の大容量HTMLファイルに対応したデータ取得関数
    async function getLargeFileContent(user, token, path) {
      const metaUrl = `https://api.github.com/repos/${user}/cook.github.io/contents/${path}`;
      const metaRes = await fetch(metaUrl, { headers: { "Authorization": `token ${token}`, "Cache-Control": "no-cache" } });
      if (!metaRes.ok) throw new Error(`ファイル取得失敗: ${path}`);
      const metaData = await metaRes.json();
      
      // 通常のレスポンスにcontentが含まれていればそれを使用（1MB未満）、なければBlob APIを使用
      if (metaData.content) {
        return decodeURIComponent(escape(atob(metaData.content)));
      }
      
      const blobUrl = `https://api.github.com/repos/${user}/cook.github.io/git/blobs/${metaData.sha}`;
      const blobRes = await fetch(blobUrl, { headers: { "Authorization": `token ${token}` } });
      if (!blobRes.ok) throw new Error(`大容量ファイルの本体取得に失敗: ${path}`);
      
      const blobData = await blobRes.json();
      return decodeURIComponent(escape(atob(blobData.content.replace(/\s/g, ''))));
    }

    async function getFileMeta(user, token, path) {
      const url = `https://api.github.com/repos/${user}/cook.github.io/contents/${path}`;
      const res = await fetch(url, { headers: { "Authorization": `token ${token}`, "Cache-Control": "no-cache" } });
      if (!res.ok) throw new Error(`メタデータ取得失敗: ${path}`);
      return await res.json();
    }

    function extractBase64Image(htmlContent) {
      const match = htmlContent.match(/src="(data:image\/(png|jpeg|jpg|gif|webp);base64,[^"]+)"/);
      if (!match) return null;
      return { data: match[1].split(',')[1], format: match[2] };
    }

    async function uploadSingleImage(user, token, imageName, base64Data, originFile) {
      const url = `https://api.github.com/repos/${user}/cook.github.io/contents/images/${imageName}`;
      
      let existingSha = null;
      try {
        const check = await fetch(url, { headers: { "Authorization": `token ${token}` } });
        if (check.ok) {
          const checkData = await check.json();
          existingSha = checkData.sha;
        }
      } catch(e) {}

      const body = { message: `add: 画像 ${imageName} (from: ${originFile})`, content: base64Data };
      if (existingSha) body.sha = existingSha;

      const res = await fetch(url, {
        method: 'PUT',
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if (!res.ok) throw new Error(`画像アップロード失敗 [${imageName}]: ステータス ${res.status}`);
      log(`✓ アップロード成功: ${imageName} [対象: ${originFile}]`, 'success');
    }

    async function updateFileOnGitHub(user, token, path, content, message, sha) {
      const url = `https://api.github.com/repos/${user}/cook.github.io/contents/${path}`;
      const base64Data = btoa(unescape(encodeURIComponent(content)));
      
      const body = { message: message, content: base64Data };
      if (sha) body.sha = sha;

      const res = await fetch(url, {
        method: 'PUT',
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if (!res.ok) throw new Error(`${path} のGitHub保存に失敗しました。ステータス: ${res.status}`);
    }
  </script>
</body>
</html>
